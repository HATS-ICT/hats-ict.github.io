<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HATS Lab — Logo Options</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#faf9f6; color:#1c1917; margin:0; padding:40px; }
    h1 { color:#990000; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:24px; margin-top:24px; }
    .card { background:#fff; border:1px solid #e7e5e4; border-radius:14px; padding:20px; }
    .card h2 { font-size:15px; margin:0 0 16px; }
    .row { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
    .row.dark { background:#1c1917; border-radius:10px; padding:12px; margin-top:14px; }
    .s16 { width:16px; height:16px; }
    .s32 { width:32px; height:32px; }
    .s64 { width:64px; height:64px; }
    .s128 { width:128px; height:128px; }
    .lbl { font-size:12px; color:#78716c; }
    .current { border-color:#990000; }
  </style>
</head>
<body>
  <h1>HATS Lab — Logo / Favicon Options</h1>
  <p class="lbl">Each card shows the mark at favicon sizes (16, 32px), logo size (64px) and large (128px), plus on a dark background.</p>
  <div class="grid" id="grid"></div>
  <script>
    const opts = [
      ["Current (reference)", "../favicon.svg"],
      ["Option 1 — Gradient triangle", "option1-gradient-triangle.svg"],
      ["Option 2 — Cardinal & gold", "option2-cardinal-gold.svg"],
      ["Option 3 — Network hub", "option3-network-hub.svg"],
      ["Option 4 — Rounded tile", "option4-rounded-tile.svg"],
      ["Option 5 — Orbit / adaptive", "option5-orbit-adaptive.svg"],
      ["Option 6 — H monogram", "option6-h-monogram.svg"],
    ];
    const grid = document.getElementById('grid');
    for (const [name, src] of opts) {
      const img = s => `<img class="${s}" src="${src}" alt="${name}">`;
      grid.insertAdjacentHTML('beforeend', `
        <div class="card${name.startsWith('Current')?' current':''}">
          <h2>${name}</h2>
          <div class="row">
            ${img('s16')}${img('s32')}${img('s64')}${img('s128')}
          </div>
          <div class="row dark">
            ${img('s32')}${img('s64')}
          </div>
        </div>`);
    }
  </script>
</body>
</html>
